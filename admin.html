<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导航后台管理</title><link rel="stylesheet" href="/assets/admin.css"></head><body><main class="wrap"><header><div><a class="back" href="/">← 返回前台</a><h1>导航管理</h1><p>管理分类与网址，保存后前台立即更新。</p></div><button id="logout" class="secondary hidden">退出登录</button></header><section id="login-panel" class="panel login"><h2>管理员登录</h2><form id="login-form"><label>管理员密码<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">登录</button><p id="login-error" class="error"></p></form></section><section id="admin-panel" class="hidden"><div class="toolbar"><button id="save">保存全部修改</button><button id="add-category" class="secondary">添加分类</button><button id="add-site" class="secondary">添加网址</button><span id="status" aria-live="polite"></span></div><div class="panel"><h2>分类管理</h2><div class="table-wrap"><table><thead><tr><th>分类名称</th><th>排序</th><th>显示</th><th>操作</th></tr></thead><tbody id="categories"></tbody></table></div></div><div class="panel"><h2>网址管理</h2><div class="table-wrap"><table><thead><tr><th>网站名称</th><th>网址</th><th>所属分类</th><th>排序</th><th>显示</th><th>操作</th></tr></thead><tbody id="sites"></tbody></table></div></div></section></main><script src="/assets/admin.js" defer></script></body></html>
